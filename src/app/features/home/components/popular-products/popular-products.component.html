<section class="py-10">
  <div class="container 2xl:max-w-8xl">
    <!-- ================= Section Header ================= -->
    <div class="flex items-center justify-between mb-6">
      <div
        class="relative pl-4 text-[28px] leading-none font-extrabold tracking-tight after:absolute after:left-0 after:top-1/2 after:-translate-y-1/2 after:h-8 after:w-1.5 after:rounded-full after:bg-emerald-600"
      >
        <span class="text-slate-800 pr-1">Featured</span>
        <span class="text-emerald-600">Products</span>
      </div>

      <button
        class="hidden sm:flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-emerald-600 transition-colors duration-200"
      >
        View All
        <i class="fas fa-arrow-right text-xs"></i>
      </button>
    </div>

    <!-- ================= Products Grid ================= -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
      @for (product of productsList(); track product._id) {
        <app-card [product]="product" />
      }
    </div>

    <!-- ================= Mobile View All ================= -->
    <div class="flex justify-center mt-7 sm:hidden">
      <button
        class="flex items-center gap-2 px-5 py-2.5 rounded-xl border border-emerald-600 text-emerald-600 text-sm font-semibold hover:bg-emerald-600 hover:text-white transition-all duration-200"
      >
        View All Products
        <i class="fas fa-arrow-right text-xs"></i>
      </button>
    </div>
  </div>
</section>
