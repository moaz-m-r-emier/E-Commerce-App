        <!-- ================= Product Card ================= -->
        <div
          class="group bg-white
                 border border-gray-100
                 rounded-2xl
                 overflow-hidden
                 shadow-sm
                 hover:shadow-lg
                 hover:border-gray-200
                 transition-all duration-300"
        >

          <!-- ================= Image ================= -->
          <div class="relative overflow-hidden mb-4">

            <!-- الصورة زي ما هي بالضبط -->
            <img
              [src]="product().imageCover"
              [alt]="product().title"
              [title]="product().title"
              class="w-full h-auto object-cover"
            />


            <!-- ================= Action Buttons ================= -->
            <div
              class="absolute top-3 right-3
                     flex flex-col gap-2
                     opacity-0 translate-x-2
                     group-hover:opacity-100
                     group-hover:translate-x-0
                     transition-all duration-300"
            >

              <button
                (click)="addProductToWishList(product()._id)"

                type="button"
                class="w-9 h-9
                       bg-white
                       border border-gray-100
                       rounded-full
                       flex items-center justify-center
                       text-gray-500
                       shadow-sm
                       hover:bg-rose-500
                       hover:text-white
                       hover:border-rose-200
                       transition-all duration-200
                       cursor-pointer"
              >
                <i class="far fa-heart text-sm"></i>
              </button>

              <button
                type="button"
                class="w-9 h-9
                       bg-white
                       border border-gray-100
                       rounded-full
                       flex items-center justify-center
                       text-gray-500
                       shadow-sm
                       hover:bg-emerald-600
                       hover:text-white
                       hover:border-emerald-600
                       transition-all duration-200
                       cursor-pointer"
              >
                <i class="fas fa-sync-alt text-sm"></i>
              </button>

              <button
                type="button"
                class="w-9 h-9
                       bg-white
                       border border-gray-100
                       rounded-full
                       flex items-center justify-center
                       text-gray-500
                       shadow-sm
                       hover:bg-emerald-600
                       hover:text-white
                       hover:border-emerald-600
                       transition-all duration-200
                       cursor-pointer
                       "
                       [routerLink]="['/details',product().slug,product()._id]"
              >
                <i class="far fa-eye text-sm"></i>
              </button>

            </div>

          </div>


          <!-- ================= Product Info ================= -->
          <div class="px-4 pb-4">

            <!-- Category -->
            <p
              class="text-[11px]
                     uppercase
                     tracking-wider
                     font-semibold
                     text-emerald-600
                     mb-1.5"
            >
              {{ product().category.name }}
            </p>


            <!-- Title -->
            <h3
              class="text-[15px]
                     leading-6
                     font-semibold
                     text-slate-800
                     line-clamp-2
                     min-h-12
                     cursor-pointer
                     hover:text-emerald-600
                     transition-colors duration-200"
            >
              {{ product().title }}
            </h3>


            <!-- ================= Rating ================= -->
            <div class="flex items-center gap-2 mt-3">

              <div class="flex items-center gap-0.5">

                <i class="fas fa-star text-yellow-400 text-[11px]"></i>
                <i class="fas fa-star text-yellow-400 text-[11px]"></i>
                <i class="fas fa-star text-yellow-400 text-[11px]"></i>
                <i class="fas fa-star text-yellow-400 text-[11px]"></i>
                <i class="far fa-star text-gray-300 text-[11px]"></i>

              </div>

              <span class="text-[11px] text-gray-400">
                {{ product().ratingsAverage }}
              </span>

              <span class="text-[11px] text-gray-300">
                ({{ product().ratingsQuantity }})
              </span>

            </div>


            <!-- ================= Bottom ================= -->
            <div
              class="flex items-center justify-between
                     mt-4 pt-3
                     border-t border-gray-100"
            >

              <!-- Price -->
              <div>
                <span
                  class="block text-2xs
                         uppercase tracking-wider
                         text-gray-400 mb-0.5"
                >
                  Price
                </span>

                <span
                  class="text-[18px]
                         font-bold
                         tracking-tight
                         text-slate-900"
                >
                  {{ product().price | currency:'GBP' }}
                </span>
              </div>


              <!-- Add -->
              <button
              (click)="addProductItemToYourCart(product()._id)"
                type="button"
                class="w-10 h-10
                cursor-pointer
                       bg-emerald-600
                       text-white
                       rounded-xl
                       flex items-center justify-center
                       shadow-sm
                       hover:bg-emerald-700
                       hover:shadow-md
                       active:scale-95
                       transition-all duration-200"
              >
                <i class="fas fa-plus text-sm"></i>
              </button>

            </div>

          </div>

        </div>
